Arborist=Сажайте и выращивайте деревья! Создавайте саженцы из древесины и бросайте их, чтобы посадить настоящие деревья. Идеально для лесовосстановления, снижения загрязнения и возобновляемого производства древесины. Деревья адаптируются к биомам - зеленые деревья на траве, красные/коричневые деревья в пустынях. Озелените леса вокруг вашей фабрики!


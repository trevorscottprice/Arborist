[mod-description]
Arborist=Sadź i hoduj drzewa! Wytwarzaj sadzonki z drewna i rzucaj je, aby posadzić prawdziwe drzewa. Idealne do ponownego zalesiania, redukcji zanieczyszczeń i odnawialnej uprawy drewna. Drzewa dostosowują się do biomów - zielone drzewa na trawie, czerwone/brązowe drzewa na pustyniach. Zasadź na nowo lasy wokół twojej fabryki!

